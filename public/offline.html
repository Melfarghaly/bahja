<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#134E4A">
    <title>لا يوجد اتصال — بهجة</title>
    <style>
        :root { --teal: #134E4A; --coral: #F26A4F; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif; background: #f4f2ed; color: #1f2937; }
        .card { max-width: 420px; text-align: center; background: #fff; border-radius: 20px; padding: 32px 24px;
                box-shadow: 0 8px 24px -18px rgba(16,24,40,.35); }
        .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: var(--teal);
                display: grid; place-items: center; }
        .mark span { width: 18px; height: 18px; border-radius: 50%; background: var(--coral); }
        h1 { font-size: 1.25rem; margin: 0 0 8px; color: var(--teal); }
        p { margin: 0 0 20px; line-height: 1.7; color: #4b5563; }
        button { border: 0; border-radius: 12px; padding: 12px 24px; font: inherit; font-weight: 700;
                 background: var(--coral); color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark"><span></span></div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تأكد من الاتصال ثم أعد المحاولة. لحماية بيانات الأطفال لا يحفظ بهجة أي صفحات على الجهاز.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
</body>
</html>
